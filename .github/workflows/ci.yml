name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install numpy pandas scikit-learn rdkit-pypi requests pillow

      - name: Lint with flake8
        run: |
          flake8 model.py featurizer.py config.py inference.py abuse_predictor.py pharmacology_rules.py \
            --max-line-length 120 --ignore E501,W503,E402 --count --show-source --statistics

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
